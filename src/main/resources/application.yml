server:
  port: 8080

spring:
  application:
    name: Nexus

  datasource:
    url: jdbc:postgresql://localhost:5432/socialapp
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  elasticsearch:
    uris: http://localhost:9200

  h2:
    console:
      enabled: false

app:
  jwt:
    secret: YourSuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm2025!
    expiration-ms: 900000
    refresh-expiration-ms: 604800000


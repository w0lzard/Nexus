server:
  port: 8080

spring:
  application:
    name: Nexus

  datasource:
    url: jdbc:postgresql://localhost:5432/socialapp
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

  elasticsearch:
    uris: http://localhost:9200

  h2:
    console:
      enabled: false

app:
  base-url: http://localhost:8080
  jwt:
    secret: YourSuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm2025!
    expiration-ms: 900000
    refresh-expiration-ms: 604800000

  cloudinary:
    cloud-name: your-cloud-name
    api-key: your-api-key
    api-secret: your-api-secret

  mail:
    from: noreply@nexus.app

spring:
  mail:
    host: smtp.mailtrap.io
    port: 587
    username: your-mailtrap-username
    password: your-mailtrap-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


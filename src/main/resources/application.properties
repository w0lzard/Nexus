# Server
server.port=8080

# Application
spring.application.name=Nexus

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/socialapp
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Cache
spring.cache.type=redis

# Elasticsearch
spring.elasticsearch.uris=http://localhost:9200

# H2
spring.h2.console.enabled=false

# Mail (SMTP)
spring.mail.host=smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=your-mailtrap-username
spring.mail.password=your-mailtrap-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.test-connection=false

# Actuator
management.health.mail.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# App - General
app.base-url=http://localhost:8080

# App - JWT
app.jwt.secret=YourSuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm2025!
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# App - Cloudinary
app.cloudinary.cloud-name=your-cloud-name
app.cloudinary.api-key=your-api-key
app.cloudinary.api-secret=your-api-secret

# App - Mail
app.mail.from=noreply@nexus.app


# Datasource (H2 in-memory for tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=false

# Cache
spring.cache.type=simple

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Mail
spring.mail.host=localhost
spring.mail.port=25

# Autoconfigure exclusions
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# App - JWT
app.jwt.secret=TestSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm2025!
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# App - Cloudinary
app.cloudinary.cloud-name=test
app.cloudinary.api-key=test
app.cloudinary.api-secret=test

# App - Mail
app.mail.from=test@test.com

# App - General
app.base-url=http://localhost:8080


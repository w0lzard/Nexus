# Datasource (H2 in-memory for tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=false

# Cache ? disable Redis, use no-op
spring.cache.type=none

# Redis ? set dummy values so connection factory can be configured without connecting
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Allow TestRedisConfig to override the Redis template bean
spring.main.allow-bean-definition-overriding=true

# Autoconfigure exclusions
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.cache.RedisCacheManagerBuilderCustomizerAutoConfiguration

# Mail
spring.mail.host=localhost
spring.mail.port=25
spring.mail.test-connection=false
management.health.mail.enabled=false

# Cloudinary ? dummy values for tests
app.cloudinary.cloud-name=test-cloud
app.cloudinary.api-key=test-key
app.cloudinary.api-secret=test-secret

# App - JWT
app.jwt.secret=TestSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm2025!
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# App - Mail
app.mail.from=noreply@test.com
app.base-url=http://localhost:8080

# Actuator
management.endpoints.web.exposure.include=health
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# App - Cloudinary
app.cloudinary.cloud-name=test
app.cloudinary.api-key=test
app.cloudinary.api-secret=test

# App - Mail
app.mail.from=test@test.com

# App - General
app.base-url=http://localhost:8080

